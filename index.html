<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Tactical Strike Online</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;color:#fff;font-family:Arial,sans-serif;touch-action:none}#game{display:block;width:100vw;height:100vh;background:#202a2d}#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#101820ee,#263b43ee);z-index:5}.card{width:min(92vw,420px);padding:28px;background:#17252cee;border:1px solid #6a8b8b;border-radius:16px;box-shadow:0 15px 50px #0009;text-align:center}.card h1{letter-spacing:2px;color:#f4c95d}.card input{width:100%;padding:13px;margin:7px 0;border:1px solid #607b80;border-radius:8px;background:#0d171b;color:white;font-size:16px}.card button{width:100%;padding:14px;margin-top:10px;border:0;border-radius:8px;background:#d5a83b;color:#111;font-weight:bold;font-size:17px}.hint{color:#b8c8c8;font-size:12px;line-height:1.5}#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none;text-shadow:1px 2px 3px #000;font-weight:bold;font-size:14px}#status{position:fixed;top:40px;left:50%;transform:translateX(-50%);color:#ffe18a;text-shadow:1px 2px #000}#controls{display:none;position:fixed;inset:auto 0 12px 0;justify-content:space-between;align-items:end;padding:0 18px;pointer-events:none}.pad,.actions{pointer-events:auto;display:grid;gap:7px}.pad{grid-template-columns:52px 52px 52px;grid-template-rows:52px 52px}.pad button,.actions button{border:1px solid #ffffff77;background:#17252ccc;color:white;border-radius:12px;font-size:18px;touch-action:none}.pad button:nth-child(1){grid-column:2}.pad button:nth-child(2){grid-column:1;grid-row:2}.pad button:nth-child(3){grid-column:2;grid-row:2}.pad button:nth-child(4){grid-column:3;grid-row:2}.actions{grid-template-columns:repeat(2,66px)}.actions button{height:48px;font-size:13px}.fire{background:#a83a2dcc!important}.actions{max-height:42vh;overflow:auto}.actions button{min-width:64px}.card{backdrop-filter:blur(8px)}.small{font-size:11px!important}@media(pointer:coarse){#controls{display:flex}#hud{font-size:12px}}
</style></head><body><canvas id="game"></canvas><div id="menu"><div class="card"><h1>TACTICAL STRIKE</h1><p>ÇEVRİM İÇİ ÇOK OYUNCULU</p><input id="name" maxlength="18" placeholder="Oyuncu adın" value="Oyuncu"><input id="room" maxlength="12" placeholder="Oda kodu (boş = PUBLIC)" value="PUBLIC"><button id="join">OYUNA KATIL</button><p class="hint">Aynı oda kodunu arkadaşlarınla paylaş. Farklı internetlerden bağlanabilirsiniz; sunucunun internette yayınlanması gerekir.</p><p id="err" class="hint"></p><p class="hint">PC: WASD • Ateş: Fare / R2 • Şarjör: R / X • Silah: 1-8 • PS4 kolu desteklenir</p></div></div><div id="hud"><span id="left">Bağlantı bekleniyor</span><span id="right"></span></div><div id="status"></div><div id="controls"><div class="pad"><button data-k="up">▲</button><button data-k="left">◀</button><button data-k="down">▼</button><button data-k="right">▶</button></div><div class="actions"><button class="fire" data-k="fire">ATEŞ</button><button data-k="reload">ŞARJÖR</button><button data-w="m4">M4</button><button data-w="glock">GLOCK</button><button data-w="awp">AWP</button><button data-w="minigun">MINIGUN</button><button data-w="ak47">AK-47</button><button data-w="mp5">MP5</button><button data-w="shotgun">POMPALI</button><button data-w="deagle">DEAGLE</button></div></div><script>
const c=document.getElementById('game'),ctx=c.getContext('2d');let ws=null,myId='',map={w:1485,h:945,walls:[],site:[1130,90,260,210]},players=[],bullets=[],keys={},touch={},mouse={x:0,y:0,fire:false},lastSend=0,joined=false,weapon='m4',pendingReload=false,prevAmmo=null,prevReloading=false,prevKills=0,audioCtx=null,voiceReady=false,prevPadReload=false;
function resize(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();
function screen(){let scale=Math.min(innerWidth/map.w,innerHeight/map.h);return {s:scale,ox:(innerWidth-map.w*scale)/2,oy:(innerHeight-map.h*scale)/2}}
function join(){let proto=location.protocol==='https:'?'wss':'ws';ws=new WebSocket(`${proto}://${location.host}/ws`);document.getElementById('err').textContent='Sunucuya bağlanılıyor...';ws.onopen=()=>ws.send(JSON.stringify({type:'join',name:document.getElementById('name').value,room:document.getElementById('room').value||'PUBLIC'}));ws.onmessage=e=>{let d=JSON.parse(e.data);if(d.type==='joined'){myId=d.id;map=d.map;joined=true;document.getElementById('menu').style.display='none';document.getElementById('status').textContent='Oda: '+d.room+' — arkadaşlarına oda kodunu gönder';setTimeout(()=>document.getElementById('status').textContent='',3500)}if(d.type==='state'){players=d.players;bullets=d.bullets}};ws.onclose=()=>{joined=false;document.getElementById('menu').style.display='flex';document.getElementById('err').textContent='Bağlantı kesildi. Sunucu adresini kontrol et.'};ws.onerror=()=>document.getElementById('err').textContent='Sunucuya bağlanılamadı.'}
document.getElementById('join').onclick=join;
function setKey(k,v){if(k==='fire')mouse.fire=v;else if(k==='reload'&&v)pendingReload=true;else touch[k]=v}
function sound(type){
 try{
  audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended')audioCtx.resume();
  const t=audioCtx.currentTime, o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.connect(g);g.connect(audioCtx.destination);
  if(type==='shot'){o.type='sawtooth';o.frequency.setValueAtTime(115,t);o.frequency.exponentialRampToValueAtTime(42,t+.085);g.gain.setValueAtTime(.10,t);g.gain.exponentialRampToValueAtTime(.001,t+.11);o.start(t);o.stop(t+.12)}
  else {o.type='square';o.frequency.setValueAtTime(520,t);o.frequency.setValueAtTime(300,t+.08);o.frequency.setValueAtTime(650,t+.16);g.gain.setValueAtTime(.055,t);g.gain.exponentialRampToValueAtTime(.001,t+.24);o.start(t);o.stop(t+.25)}
 }catch(e){}
}
function radio(line){
 if(!('speechSynthesis' in window))return;
 try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(line);u.lang='en-US';u.rate=1.08;u.pitch=.82;u.volume=.7;speechSynthesis.speak(u)}catch(e){}
}
function gamepadInput(){
 const pads=navigator.getGamepads?navigator.getGamepads():[];
 const p=Array.from(pads).find(x=>x&&x.connected);if(!p)return {};
 const dz=v=>Math.abs(v)>.18?v:0, ax=p.axes||[], b=p.buttons||[];
 const pressed=i=>!!(b[i]&&(b[i].pressed||b[i].value>.55));
 // PS4 mapping requested: R2 = fire, X = reload.
 if(pressed(0)&&!prevPadReload)pendingReload=true;prevPadReload=pressed(0);
 return {up:dz(ax[1]||0)<0||pressed(12),down:dz(ax[1]||0)>0||pressed(13),
 left:dz(ax[0]||0)<0||pressed(14),right:dz(ax[0]||0)>0||pressed(15),
 fire:pressed(7)||((b[7]?.value||0)>.35),sprint:pressed(10),aimX:dz(ax[2]||0),aimY:dz(ax[3]||0)};
}
document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);setKey(k,true)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>setKey(k,false)))});
document.querySelectorAll('[data-w]').forEach(b=>b.addEventListener('click',()=>weapon=b.dataset.w));
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;const weaponKeys={1:'m4',2:'glock',3:'awp',4:'minigun',5:'ak47',6:'mp5',7:'shotgun',8:'deagle'};if(weaponKeys[e.key])weapon=weaponKeys[e.key];if(e.key.toLowerCase()==='r'&&!e.repeat)pendingReload=true});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
c.addEventListener('pointermove',e=>{let r=c.getBoundingClientRect(),sc=screen();mouse.x=(e.clientX-sc.ox)/sc.s;mouse.y=(e.clientY-sc.oy)/sc.s});c.addEventListener('pointerdown',e=>{let sc=screen();mouse.x=(e.clientX-sc.ox)/sc.s;mouse.y=(e.clientY-sc.oy)/sc.s;if(e.pointerType==='mouse'||e.pointerType==='touch'){mouse.fire=true;try{c.setPointerCapture(e.pointerId)}catch(_){}}});addEventListener('pointerup',e=>{mouse.fire=false});
function draw(){requestAnimationFrame(draw);const gp=gamepadInput();ctx.clearRect(0,0,innerWidth,innerHeight);let sc=screen();ctx.save();ctx.translate(sc.ox,sc.oy);ctx.scale(sc.s,sc.s);ctx.fillStyle='#35413c';ctx.fillRect(0,0,map.w,map.h);ctx.fillStyle='#3c4941';for(let gx=0;gx<map.w;gx+=110)for(let gy=0;gy<map.h;gy+=110){if(((gx/110+gy/110)|0)%2===0)ctx.fillRect(gx,gy,55,55)}ctx.strokeStyle='#46544b';ctx.lineWidth=1;for(let x=0;x<map.w;x+=55){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,map.h);ctx.stroke()}for(let y=0;y<map.h;y+=55){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(map.w,y);ctx.stroke()}let [sx,sy,sw,sh]=map.site;ctx.fillStyle='#b78b2733';ctx.fillRect(sx,sy,sw,sh);ctx.strokeStyle='#e6bd4b';ctx.strokeRect(sx,sy,sw,sh);ctx.fillStyle='#f4d06b';ctx.font='bold 24px Arial';ctx.fillText('BOMB SITE',sx+55,sy+35);for(let [x,y,w,h] of map.walls){ctx.fillStyle='#20282a';ctx.fillRect(x,y,w,h);ctx.strokeStyle='#75817c';ctx.strokeRect(x,y,w,h)}ctx.fillStyle='#a47a45';for(let [x,y] of [[350,340],[390,340],[760,270],[800,270],[1120,480],[1160,480],[560,760],[600,760],[1280,730],[1320,730]]){ctx.fillRect(x,y,34,34);ctx.strokeStyle='#d0a36a';ctx.strokeRect(x,y,34,34);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+34,y+34);ctx.moveTo(x+34,y);ctx.lineTo(x,y+34);ctx.stroke()}for(let b of bullets){ctx.fillStyle='#ffe17b';ctx.beginPath();ctx.arc(b.x,b.y,3,0,Math.PI*2);ctx.fill()}for(let p of players){ctx.globalAlpha=p.alive?1:.3;ctx.fillStyle=p.id===myId?'#55d7ff':'#f16c5e';ctx.beginPath();ctx.arc(p.x,p.y,14,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#111';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+Math.cos(p.angle)*24,p.y+Math.sin(p.angle)*24);ctx.stroke();ctx.globalAlpha=1;ctx.fillStyle='white';ctx.font='14px Arial';ctx.textAlign='center';ctx.fillText(p.name,p.x,p.y-23);ctx.fillStyle='#411';ctx.fillRect(p.x-18,p.y-19,36,4);ctx.fillStyle='#62dc78';ctx.fillRect(p.x-18,p.y-19,36*Math.max(0,p.hp/100),4)}ctx.restore();let me=players.find(p=>p.id===myId);if(me){document.getElementById('left').textContent=`CAN ${Math.ceil(me.hp)} | ZIRH ${Math.ceil(me.armor)} | ÖLDÜRME ${me.kills}`;document.getElementById('right').textContent=`${me.weapon.toUpperCase()}  ${me.ammo[me.weapon]} / ${me.reserve[me.weapon]}`;
let currentAmmo=me.ammo[me.weapon], reloading=!!(me.reload_until&&me.reload_until>Date.now()/1000);
if(prevAmmo!==null&&currentAmmo<prevAmmo&&!reloading)sound('shot');
if(reloading&&!prevReloading){sound('reload');radio('Reloading!')}
if(prevReloading&&!reloading)radio('Ready!');
if(me.kills>prevKills)radio('Target down!');
prevAmmo=currentAmmo;prevReloading=reloading;prevKills=me.kills;
let a=(Math.hypot(gp.aimX,gp.aimY)>.25)?Math.atan2(gp.aimY,gp.aimX):Math.atan2(mouse.y-me.y,mouse.x-me.x);if(!Number.isFinite(a))a=me.angle;let inp={up:keys.w||keys.arrowup||touch.up||gp.up,down:keys.s||keys.arrowdown||touch.down||gp.down,left:keys.a||keys.arrowleft||touch.left||gp.left,right:keys.d||keys.arrowright||touch.right||gp.right,sprint:keys.shift||gp.sprint,fire:mouse.fire||touch.fire||gp.fire,reload:pendingReload,weapon,angle:a};if(ws&&ws.readyState===1&&performance.now()-lastSend>30){ws.send(JSON.stringify({type:'input',input:inp}));pendingReload=false;lastSend=performance.now()}}}
draw();
</script></body></html>
